version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aerotwin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aerotwin_user
      POSTGRES_PASSWORD: aerotwin_password
      POSTGRES_DB: aerotwin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed/001_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - aerotwin-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aerotwin-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - aerotwin-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerotwin-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://aerotwin_user:aerotwin_password@postgres:5432/aerotwin_db
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=aerotwin-jwt-secret-key-2026
      - XAI_API_KEY=${XAI_API_KEY}
    depends_on:
      - postgres
      - ai-service
    networks:
      - aerotwin-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerotwin-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aerotwin-net

networks:
  aerotwin-net:
    driver: bridge

volumes:
  postgres_data:
